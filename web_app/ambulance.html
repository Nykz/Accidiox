<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Accidiox Crew</title>
  <link rel="manifest" href="manifest-crew.json" />
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/ambulance.css?v=2" />
  <script src="js/session.js?v=2"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6l-8-3Z"/><path d="M12 8.5v7M8.5 12h7"/></symbol>
      <symbol id="i-ambulance" viewBox="0 0 24 24"><path d="M10 10H6M8 8v4"/><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.28a1 1 0 0 0-.68-.95l-1.9-.64a1 1 0 0 1-.6-.53L17.6 9.6A1 1 0 0 0 16.7 9H14"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/><path d="M9 18h6"/></symbol>
      <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11 22 2l-9 19-2-8-8-2Z"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
      <symbol id="i-droplet" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
      <symbol id="i-radio" viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5M19.1 4.9C23 8.8 23 15.1 19.1 19"/></symbol>
      <symbol id="i-building" viewBox="0 0 24 24"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M10 6h4M12 4v4M10 14h4M10 18h4"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="top">
      <span class="brand-mark"><svg class="ic"><use href="#i-logo"/></svg></span>
      <div class="top-id">
        <strong><span id="unitCode">—</span> <span class="type-tag" id="unitType">—</span></strong>
        <span id="hospitalName">Loading…</span>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="btnMenu" aria-haspopup="menu" aria-expanded="false" aria-label="Menu"><svg class="ic"><use href="#i-more"/></svg></button>
        <div class="menu" id="menu" role="menu">
          <div class="menu-head"><strong id="crewName">—</strong><span id="crewEmail"></span></div>
          <button class="menu-item danger" id="btnSignOut" role="menuitem"><svg class="ic ic-sm"><use href="#i-out"/></svg><span>Sign out</span></button>
        </div>
      </div>
    </header>

    <!-- Duty + GPS -->
    <section class="duty" id="dutyCard">
      <div class="duty-text">
        <strong id="dutyTitle">Off duty</strong>
        <span id="dutySub">Go on duty to receive dispatches</span>
      </div>
      <button class="switch" id="dutySwitch" role="switch" aria-checked="false" aria-label="On duty"><span></span></button>
    </section>

    <!-- Idle -->
    <section class="idle" id="idleView">
      <div class="radar"><span></span><span></span><svg class="ic"><use href="#i-radio"/></svg></div>
      <h1 id="idleTitle">You're off duty</h1>
      <p id="idleText">Switch on duty and keep this screen open. New emergencies will ring here.</p>
      <div class="stats">
        <div><span>Completed today</span><strong id="statDone">0</strong></div>
        <div><span>Vehicle</span><strong id="statVehicle">—</strong></div>
      </div>
    </section>

    <!-- Assignment -->
    <section class="job" id="jobView" hidden>
      <div class="job-banner" id="jobBanner"></div>

      <div class="card patient">
        <div class="patient-top">
          <div class="patient-id">
            <span class="eyebrow">Patient</span>
            <strong id="patientName">—</strong>
            <span id="patientVehicle"></span>
          </div>
          <div class="blood" id="patientBlood">
            <svg class="ic"><use href="#i-droplet"/></svg>
            <strong>—</strong>
            <span>Blood</span>
          </div>
        </div>
        <div class="medical" id="patientMedical" hidden><svg class="ic ic-sm"><use href="#i-alert"/></svg><span></span></div>
        <a class="contact" id="patientContact" hidden><svg class="ic ic-sm"><use href="#i-phone"/></svg><span></span></a>
      </div>

      <div class="card place">
        <div class="place-top">
          <span class="eyebrow" id="placeEyebrow">Crash site</span>
          <strong id="placeName">—</strong>
          <div class="place-stats">
            <div><span>Distance</span><strong id="placeDist">—</strong></div>
            <div><span>ETA</span><strong id="placeEta">—</strong></div>
            <div><span>Impact</span><strong id="placeImpact">—</strong></div>
          </div>
        </div>
        <div id="jobMap" class="job-map"></div>
      </div>

      <div class="steps" id="jobSteps"></div>
    </section>

    <footer class="actions" id="jobActions" hidden>
      <button class="btn btn-secondary" id="btnDecline" type="button" hidden><span>Decline</span></button>
      <a class="btn btn-secondary" id="btnNavigate" target="_blank" rel="noopener noreferrer"><svg class="ic"><use href="#i-nav"/></svg><span>Navigate</span></a>
      <button class="btn btn-primary" id="btnNext"><svg class="ic"><use href="#i-check"/></svg><span>—</span></button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/ambulance.js?v=3"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>
</body>
</html>
