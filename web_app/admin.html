<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Accidiox Owner Console</title>
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="css/admin.css?v=3" />
</head>
<body>

  <!-- Sign in / first-time setup -->
  <main class="gate" id="gate" hidden>
    <form class="gate-card" id="gateForm" novalidate>
      <div class="brand-row">
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6l-8-3Z"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>
        <div><strong>Accidiox</strong><span>Owner console</span></div>
      </div>
      <h1 id="gateTitle">Sign in</h1>
      <p class="muted" id="gateHint">Only for the Accidiox owner and support team.</p>

      <label class="field setup-only" hidden>Setup key
        <input type="password" id="fKey" autocomplete="off" />
        <small>Your database password from <code>api/db_config.php</code> on Hostinger. Needed only once.</small>
      </label>
      <label class="field setup-only" hidden>Your name
        <input type="text" id="fName" autocomplete="name" />
      </label>
      <label class="field">Email
        <input type="email" id="fEmail" autocomplete="username" />
      </label>
      <label class="field">Password
        <input type="password" id="fPass" autocomplete="current-password" />
        <small class="setup-only" hidden>At least 10 characters, with letters and numbers.</small>
      </label>
      <div class="form-error" id="gateError" hidden></div>
      <button class="btn btn-primary btn-block" id="gateBtn" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Console -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand-row">
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9 4.6-.8 8-4.6 8-9V6l-8-3Z"/><path d="M12 8.5v7M8.5 12h7"/></svg></span>
        <div><strong>Accidiox</strong><span>Owner console</span></div>
      </div>
      <div class="top-right">
        <span class="live"><i></i><span id="updated">Live</span></span>
        <span class="who" id="who"></span>
        <button class="btn btn-ghost" id="btnLogout" type="button">Sign out</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <nav class="tabs" id="tabs">
      <button type="button" data-tab="open" class="active">Emergencies <b id="cOpen">0</b></button>
      <button type="button" data-tab="hospitals">Hospitals <b id="cHosp">0</b></button>
      <button type="button" data-tab="crews">Ambulance crews <b id="cCrew">0</b></button>
      <button type="button" data-tab="closed">Recently closed</button>
    </nav>

    <section class="panel" id="panel-open"></section>
    <section class="panel" id="panel-hospitals" hidden></section>
    <section class="panel" id="panel-crews" hidden></section>
    <section class="panel" id="panel-closed" hidden></section>
  </div>

  <!-- Close emergency sheet -->
  <div class="modal" id="resolveModal" hidden>
    <form class="modal-card" id="resolveForm" novalidate>
      <div class="modal-head">
        <div>
          <div class="eyebrow" id="rCode"></div>
          <h2>Mark rider safe</h2>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">&times;</button>
      </div>
      <p class="muted" id="rWho"></p>
      <div class="field">How is the rider?
        <div class="choices" id="rCondition"></div>
      </div>
      <div class="field">Treatment
        <div class="choices" id="rTreatment"></div>
      </div>
      <label class="field">What did the rider or family tell you?
        <textarea id="rNote" rows="3" maxlength="255" placeholder="e.g. Called rider at 5:20 pm. Treated at a local clinic, back home."></textarea>
      </label>
      <p class="warn">This closes the emergency everywhere. Hospitals stop seeing it, any assigned ambulance is freed, and the rider's app stops searching.</p>
      <div class="form-error" id="rError" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Keep open</button>
        <button type="submit" class="btn btn-success" id="rBtn">Close emergency</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/admin.js?v=2"></script>
</body>
</html>
